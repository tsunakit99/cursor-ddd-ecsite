version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "50051:50051"
    depends_on:
      - postgres
      - kafka
      - zookeeper
    environment:
      - ECSITE_DATABASE_COMMAND_HOST=postgres
      - ECSITE_DATABASE_COMMAND_PORT=5432
      - ECSITE_DATABASE_COMMAND_USER=postgres
      - ECSITE_DATABASE_COMMAND_PASSWORD=postgres
      - ECSITE_DATABASE_COMMAND_DBNAME=ecsite
      - ECSITE_DATABASE_COMMAND_SSLMODE=disable
      - ECSITE_DATABASE_COMMAND_MAXIDLECONNS=10
      - ECSITE_DATABASE_COMMAND_MAXOPENCONNS=100
      - ECSITE_KAFKA_BROKERS=kafka:9092
      - ECSITE_AUTH_JWTSECRET=your-jwt-secret-key-change-me-in-production
    volumes:
      - ./config:/app/config
    restart: on-failure

  api-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "3001:3001"
    volumes:
      - ./api-proxy:/app
      - /app/node_modules
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api-proxy
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    restart: on-failure

  postgres:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ecsite
    ports:
      - "5432:5432"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: always

volumes:
  postgres_data: 